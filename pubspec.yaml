name: plantpal
description: "PlantPal - a houseplant care tracker built with Flutter."
publish_to: 'none'

# versionName+versionCode used by the release build.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # REST calls to the GBIF and Wikipedia APIs.
  http: ^1.6.0

  # Shared app state (ChangeNotifier) read by every screen.
  provider: ^6.1.5+1

  # Local persistence so the plant list survives a restart.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates the Android launcher icons from assets/app_icon_1024.png.
  flutter_launcher_icons: ^0.14.4

  # Generates the native splash screen.
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/

# ---------------------------------------------------------------------------
# App icon:  flutter pub run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/app_icon_1024.png"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  min_sdk_android: 21

# ---------------------------------------------------------------------------
# Splash screen:  dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#F7FAF5"
  color_dark: "#101410"
  image: "assets/splash_logo.png"
  image_dark: "assets/splash_logo.png"
  android_12:
    image: "assets/splash_logo.png"
    icon_background_color: "#F7FAF5"
    image_dark: "assets/splash_logo.png"
    icon_background_color_dark: "#101410"
